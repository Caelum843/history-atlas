<!--
  ============================================================
  《从卢比孔到亚克兴》—— 罗马共和国的崩塌 (前49–前31)
  一个 scrollytelling（滚动叙事）原型。
  结构：
    1. CSS  ── 设计令牌 + 版面
    2. HTML ── 左侧叙事栏 + 右侧粘性地图
    3. JS   ── ① 地图数据（经纬度）与投影
               ② 场景数据（文案 + 视野 + 标记 + 路线）
               ③ 渲染与滚动联动
  这个文件刻意保持"一个文件"，方便你整体阅读和改动。
  ============================================================
-->

<style>
/* ---------- 1. 设计令牌 ----------
   这套页面刻意只有一种视觉世界：一张夜航海图。
   所以不做深浅色切换，但每个颜色都显式声明，
   保证放在任何底色上都成立。 */
:root{
  --sea:        #0d1720;   /* 海 / 页面底色 */
  --sea-deep:   #091019;   /* 更暗的海，用于渐晕 */
  --land:       #1b2830;   /* 陆地 */
  --land-hi:    #22323c;   /* 高亮陆地 */
  --coast:      #3c5766;   /* 海岸线 */
  --graticule:  #1a2833;   /* 经纬网 */
  --bone:       #e9e3d5;   /* 正文 */
  --bone-dim:   #9aa8b1;   /* 次要文字 */
  --bone-faint: #61717c;   /* 更弱 */
  --verdigris:  #5cb9a0;   /* 铜绿：凯撒 / 屋大维一方 */
  --madder:     #c86d61;   /* 茜红：庞培 / 安东尼一方 */
  --gold:       #c9a34e;   /* 年份、题注 */
  --rule:       #24333d;

  --f-display: 'Cinzel','Noto Serif SC',Georgia,serif;
  --f-body:    'Spectral','Noto Serif SC',Georgia,serif;
  --f-mono:    'IBM Plex Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--sea);
  color:var(--bone);
  font-family:var(--f-body);
  font-weight:300;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed; inset:0 0 auto 0; z-index:40;
  display:flex; align-items:center; gap:1.25rem;
  padding:.7rem clamp(1rem,3vw,2rem);
  background:linear-gradient(to bottom,rgba(9,16,25,.95),rgba(9,16,25,0));
  pointer-events:none;
}
.topbar > *{pointer-events:auto;}

.sigil{
  font-family:var(--f-display); font-weight:600;
  font-size:.78rem; letter-spacing:.22em; text-transform:uppercase;
  color:var(--gold); white-space:nowrap;
}

/* 时间轴：把 10 个场景按年份摆在一条线上 */
.rail{
  flex:1; position:relative; height:2.2rem;
  min-width:0;
}
.rail-line{
  position:absolute; left:0; right:0; top:1.05rem; height:1px;
  background:linear-gradient(to right,transparent,var(--rule) 8%,var(--rule) 92%,transparent);
}
.rail-tick{
  position:absolute; top:.55rem; width:1px; height:.55rem;
  background:var(--bone-faint); transform:translateX(-.5px);
  border:0; padding:0; cursor:pointer;
}
.rail-tick::after{
  content:''; position:absolute; inset:-.7rem -.55rem;
}
.rail-tick.on{background:var(--gold); height:1rem; top:.35rem;}
.rail-label{
  position:absolute; top:1.5rem; transform:translateX(-50%);
  font-family:var(--f-mono); font-size:.6rem; letter-spacing:.08em;
  color:var(--bone-faint); white-space:nowrap;
}

.langs{display:flex; gap:.35rem;}
.lang{
  font-family:var(--f-mono); font-size:.68rem; letter-spacing:.1em;
  background:none; border:1px solid var(--rule); color:var(--bone-dim);
  padding:.3rem .6rem; cursor:pointer; border-radius:2px;
  transition:color .2s,border-color .2s;
}
.lang.on{color:var(--gold); border-color:var(--gold);}
.lang:hover{color:var(--bone);}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

/* ---------- 主体：左文右图 ---------- */
.stage{
  display:grid;
  grid-template-columns:minmax(0,38%) minmax(0,62%);
}

/* 地图列：整列 sticky，滚动时钉在视口 */
.mapcol{
  grid-column:2;
  position:sticky; top:0; height:100vh; height:100dvh;
  overflow:hidden;
}
#atlas{display:block; width:100%; height:100%;}

/* 四边渐晕，让裁切边缘看起来是有意的 */
.vignette{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 50%,transparent 45%,var(--sea-deep) 100%);
}
/* 场景标题浮在地图上 */
.mapcaption{
  position:absolute; left:2rem; bottom:1.6rem; right:2rem;
  font-family:var(--f-mono); font-size:.66rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--bone-faint);
  display:flex; justify-content:space-between; gap:1rem;
}

/* 叙事列 */
.storycol{grid-column:1; padding:0 clamp(1.5rem,3.5vw,3.5rem);}

/* 开篇 */
.opening{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; justify-content:center;
  padding:6rem 0 4rem;
}
.opening .kicker{
  font-family:var(--f-mono); font-size:.68rem; letter-spacing:.2em;
  color:var(--gold); text-transform:uppercase; margin:0 0 1.4rem;
}
.opening h1{
  font-family:var(--f-display); font-weight:500;
  font-size:clamp(2.1rem,4.6vw,3.5rem); line-height:1.12;
  margin:0 0 1.4rem; text-wrap:balance; color:var(--bone);
}
.opening h1 em{
  font-style:normal; display:block; color:var(--gold);
  font-size:.52em; letter-spacing:.04em; margin-top:.7rem;
}
.opening p{
  max-width:34em; font-size:1.02rem; color:var(--bone-dim); margin:0 0 1.1rem;
}
.scrollhint{
  margin-top:2.5rem; font-family:var(--f-mono); font-size:.66rem;
  letter-spacing:.16em; color:var(--bone-faint); text-transform:uppercase;
  display:flex; align-items:center; gap:.7rem;
}
.scrollhint span{
  display:block; width:1px; height:2.2rem;
  background:linear-gradient(var(--gold),transparent);
}

/* 每一"屏"叙事 */
.step{
  min-height:96vh;
  display:flex; flex-direction:column; justify-content:center;
  padding:4rem 0;
  opacity:.28; transform:translateY(8px);
  transition:opacity .6s ease,transform .6s ease;
}
.step.active{opacity:1; transform:none;}

.step .year{
  font-family:var(--f-mono); font-size:.7rem; letter-spacing:.16em;
  color:var(--gold); margin:0 0 .75rem;
}
.step h2{
  font-family:var(--f-display); font-weight:500;
  font-size:clamp(1.5rem,2.5vw,2.05rem); line-height:1.25;
  margin:0 0 1.1rem; text-wrap:balance;
}
.step .body{max-width:33em; font-size:1rem; margin:0;}
.step .body + .body{margin-top:.9rem;}

/* 注释：书页边栏的小字 */
.note{
  margin-top:1.6rem; padding-left:1rem;
  border-left:1px solid var(--rule);
  max-width:30em;
  font-size:.82rem; line-height:1.65; color:var(--bone-faint);
}
.note b{
  display:block; font-family:var(--f-mono); font-weight:500;
  font-size:.6rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--bone-faint); margin-bottom:.3rem;
}

/* 结尾 */
.closing{
  min-height:70vh; display:flex; flex-direction:column; justify-content:center;
  padding:5rem 0 7rem; border-top:1px solid var(--rule); margin-top:3rem;
}
.closing p{max-width:32em; color:var(--bone-dim); font-size:.95rem;}
.closing .sig{
  font-family:var(--f-mono); font-size:.64rem; letter-spacing:.14em;
  color:var(--bone-faint); text-transform:uppercase; margin-top:2rem;
}

/* ---------- SVG 地图内部样式 ---------- */
.land{fill:var(--land); stroke:var(--coast); stroke-width:.8; vector-effect:non-scaling-stroke;}
.grat{stroke:var(--graticule); stroke-width:.6; fill:none; vector-effect:non-scaling-stroke;}

.marker{opacity:0; transition:opacity .55s ease;}
.marker.on{opacity:1;}
.marker text{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.05em;
  fill:var(--bone-dim); paint-order:stroke;
  stroke:var(--sea); stroke-width:3px; stroke-linejoin:round;
}
.marker.cjk text{font-family:var(--f-body); font-size:11px;}
.marker .dot{fill:var(--bone-dim);}
.marker.key .dot{fill:var(--gold);}
.marker.key text{fill:var(--gold);}
.marker.battle .dot{fill:none; stroke-width:1.6; vector-effect:non-scaling-stroke;}
.marker.battle text{fill:var(--bone);}

.route{
  fill:none; stroke-width:1.7; vector-effect:non-scaling-stroke;
  stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:var(--len) var(--len);
  stroke-dashoffset:var(--len);
  opacity:0;
}
.route.on{opacity:.95; stroke-dashoffset:0; transition:stroke-dashoffset 1.6s ease-out,opacity .4s;}
.route.caesar{stroke:var(--verdigris);}
.route.pompey{stroke:var(--madder); stroke-dasharray:6 5; stroke-dashoffset:0;}
.route.pompey.on{opacity:.9;}

.pulse{transform-origin:center; transform-box:fill-box;}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;}
  .route.on{transition:opacity .3s;}
  .step{transition:opacity .2s;}
}

/* ---------- 窄屏：地图在上，文字在下 ---------- */
@media (max-width:860px){
  .stage{grid-template-columns:1fr;}
  .mapcol{grid-column:1; grid-row:1; height:46vh; height:46dvh; top:3.2rem;}
  .storycol{grid-column:1; grid-row:2;}
  .opening{min-height:auto; padding:7rem 0 3rem;}
  .step{min-height:auto; padding:2.4rem 0 3rem; opacity:1; transform:none;}
  .step:not(.active) h2{color:var(--bone-dim);}
  .mapcaption{left:1rem; right:1rem; bottom:.7rem; font-size:.58rem;}
  .rail-label{display:none;}
}
</style>

</head>

  en:{year:'January, 49 BC', title:'A River Ten Feet Wide',

    note:{t:'note',c:'"The die is cast" comes from Suetonius. Plutarch records it in Greek, closer to "let the die be thrown" — a gambler\'s phrase. It means place the bet, not accept your fate.'}}

/* ============================================================
   ③ 渲染
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('atlas');
const el = (tag, attrs={}) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

let lang = 'zh';

/* --- 底图：经纬网 + 陆地 --- */
const gGrat  = el('g', {class:'grat'});
for (let lon = -10; lon <= 40; lon += 5){
  const a = project(lon, 52), b = project(lon, 20);
  gGrat.appendChild(el('line', {x1:a[0], y1:a[1], x2:b[0], y2:b[1]}));
}
for (let lat = 20; lat <= 50; lat += 5){
  const a = project(-10, lat), b = project(44, lat);
  gGrat.appendChild(el('line', {x1:a[0], y1:a[1], x2:b[0], y2:b[1]}));
}
svg.appendChild(gGrat);

const gLand = el('g');
[NORTH, AFRICA, ...ISLANDS].forEach(poly =>
  gLand.appendChild(el('path', {class:'land', d:toPath(poly)}))
);
svg.appendChild(gLand);

/* --- 路线：先全部画好，靠 class 控制显隐 --- */
const gRoutes = el('g');
svg.appendChild(gRoutes);
const routeEls = {};
SCENES.forEach(sc => {
  (sc.routes || []).forEach((r, i) => {
    const d = r.pts.map((p,j) => (j?'L':'M') + project(p[0],p[1]).join(' ')).join(' ');
    const p = el('path', {class:`route ${r.side}`, d});
    gRoutes.appendChild(p);
    // 用路径实际长度设置虚线，才能做"逐段画出"的动画
    const len = p.getTotalLength();
    p.style.setProperty('--len', len);
    routeEls[sc.id + '-' + i] = p;
  });
});

/* --- 地点标记 --- */
const gMarks = el('g');
svg.appendChild(gMarks);
const markEls = {};
for (const id in PLACES){
  const p = PLACES[id];
  const g = el('g', {class:'marker'});
  g.appendChild(el('circle', {class:'dot', r:3.2, cx:0, cy:0}));
  const t = el('text', {x:8, y:4});
  g.appendChild(t);
  gMarks.appendChild(g);
  markEls[id] = {g, t, p};
}

/* --- 视野动画：直接补间 viewBox，比 transform 更好控制 --- */
const BASE_SPAN = 46;
let curView = {...SCENES[0].view}, tweenId = null;

function applyView(v){
  const box = svg.getBoundingClientRect();
  const aspect = (box.width || 1) / (box.height || 1);
  const w = v.span * PX_PER_DEG;
  const h = w / aspect;
  const [cx, cy] = project(v.lon, v.lat);
  svg.setAttribute('viewBox', `${cx - w/2} ${cy - h/2} ${w} ${h}`);
  // 标记要保持屏幕上大小恒定，所以按缩放比例反向缩放
  const k = v.span / BASE_SPAN;
  for (const id in markEls){
    const {g, p} = markEls[id];
    const [x, y] = project(p.lon, p.lat);
    g.setAttribute('transform', `translate(${x} ${y}) scale(${k})`);
  }
}

const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

function goToView(target, ms = 1500){
  if (tweenId) cancelAnimationFrame(tweenId);
  const from = {...curView};
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) ms = 0;
  const t0 = performance.now();
  const frame = now => {
    const k = ms ? Math.min(1, (now - t0) / ms) : 1;
    const e = easeInOut(k);
    curView = {
      lon:  from.lon  + (target.lon  - from.lon)  * e,
      lat:  from.lat  + (target.lat  - from.lat)  * e,
      span: from.span + (target.span - from.span) * e
    };
    applyView(curView);
    if (k < 1) tweenId = requestAnimationFrame(frame);
  };
  tweenId = requestAnimationFrame(frame);
}

/* --- 文案渲染 --- */
const stepsHost = document.getElementById('steps');
SCENES.forEach(sc => {
  const s = document.createElement('section');
  s.className = 'step';
  s.id = sc.id;
  s.innerHTML = `<p class="year"></p><h2></h2><div class="bodies"></div>
                 <aside class="note"><b></b><span></span></aside>`;
  stepsHost.appendChild(s);
  sc.node = s;
});

function renderText(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(n => {
    n.textContent = UI[lang][n.dataset.i18n];
  });
  SCENES.forEach(sc => {
    const d = sc[lang], n = sc.node;
    n.querySelector('.year').textContent = d.year;
    n.querySelector('h2').textContent = d.title;
    n.querySelector('.bodies').innerHTML =
      d.body.map(p => `<p class="body"></p>`).join('');
    n.querySelectorAll('.body').forEach((p, i) => { p.textContent = d.body[i]; });
    n.querySelector('.note b').textContent = d.note.t;
    n.querySelector('.note span').textContent = d.note.c;
  });
  // 地图标签也跟着切
  for (const id in markEls){
    markEls[id].t.textContent = PLACES[id][lang];
    markEls[id].g.classList.toggle('cjk', lang === 'zh');
  }
}

/* --- 时间轴 --- */
const rail = document.getElementById('rail');
SCENES.forEach((sc, i) => {
  const b = document.createElement('button');
  b.className = 'rail-tick';
  b.style.left = (sc.t * 100) + '%';
  b.setAttribute('aria-label', sc.zh.year);
  b.onclick = () => sc.node.scrollIntoView({behavior:'smooth', block:'center'});
  rail.appendChild(b);
  sc.tick = b;
  if (i === 0 || i === SCENES.length - 1){
    const l = document.createElement('div');
    l.className = 'rail-label';
    l.style.left = (sc.t * 100) + '%';
    l.textContent = i === 0 ? '49 BC' : '27 BC';
    rail.appendChild(l);
  }
});

/* --- 场景切换 --- */
let current = null;
function activate(sc){
  if (current === sc) return;
  current = sc;

  SCENES.forEach(s => {
    s.node.classList.toggle('active', s === sc);
    s.tick.classList.toggle('on', s === sc);
  });

  // 标记：只显示本场景涉及的地点
  for (const id in markEls){
    const on = sc.places.includes(id);
    const g = markEls[id].g;
    g.classList.toggle('on', on);
    g.classList.toggle('key', on && (sc.key || []).includes(id));
    g.classList.toggle('battle', on && (sc.battles || []).includes(id));
    // 战役点画成空心环，视觉上和城市区分开
    g.querySelector('.dot').setAttribute('r', (sc.battles || []).includes(id) ? 5.5 : 3.2);
    g.querySelector('.dot').setAttribute('stroke',
      (sc.battles || []).includes(id) ? 'var(--madder)' : 'none');
  }

  // 路线：本场景的画出来，其它收起
  for (const k in routeEls) routeEls[k].classList.remove('on');
  (sc.routes || []).forEach((r, i) => {
    const p = routeEls[sc.id + '-' + i];
    // 强制重排，让 dashoffset 动画每次都能重放
    void p.getBoundingClientRect();
    setTimeout(() => p.classList.add('on'), 220);
  });

  goToView(sc.view);
  document.getElementById('capRight').textContent = sc.cap;
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting){
      const sc = SCENES.find(s => s.node === e.target);
      if (sc) activate(sc);
    }
  });
}, {rootMargin:'-45% 0px -45% 0px', threshold:0});
SCENES.forEach(sc => io.observe(sc.node));

/* --- 语言切换 --- */
document.querySelectorAll('.lang').forEach(b => {
  b.onclick = () => {
    lang = b.dataset.lang;
    document.querySelectorAll('.lang').forEach(x => x.classList.toggle('on', x === b));
    renderText();
  };
});

/* --- 启动 --- */
renderText();
applyView(curView);
activate(SCENES[0]);
addEventListener('resize', () => applyView(curView));
</script>
