title: { zh: 罗马, en: Rome }
subtitle: { zh: 从一座城市，到两个帝国宫廷 }
span:
  label: { zh: 约前 753 — 公元 476 年（第一编辑范围） }
  fromSortKey: -753
  toSortKey: 476
summary:
  zh: >-
    罗马不是从共和国直接变成帝国，再突然一分为二。城市、军队、公民权、皇权、宗教和行政中心
    在一千多年里以不同速度变化；同一个名字之下，存在过许多不同的罗马。
scopeNote:
  zh: >-
    起点沿用传统建城纪年，只作导航坐标；早期历史大量依赖后世叙述与考古重建。
    公元 476 年只是本轮西部编辑范围的暂定终点，东部罗马帝国的延续将在后续卷中独立展开。
